name: Release Wayland Capture Daemon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Daemon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            pkg-config \
            clang \
            build-essential

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sanguine_wayland_capture/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release Binary
        run: |
          cd sanguine_wayland_capture
          cargo build --release

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: sanguine_wayland_capture/target/release/sanguine_wayland_capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
